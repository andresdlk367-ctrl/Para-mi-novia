<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sorpresa mi amor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#070b14; --wall:#16202e; --wall2:#1d2a3b; --cream:#f1e2b8; --ink:#2a2f3a;
  --orange:#e0582a; --gold:#f2b84b; --blue:#4f78c4; --paper:#e9e6df;
  --pix:'Silkscreen','Courier New',monospace; --txt:'VT323','Courier New',monospace;
  box-sizing:border-box; padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--cream);font-family:var(--txt);font-size:22px;overflow-x:hidden}
#app{min-height:100%;position:relative;display:flex;flex-direction:column;
  background:radial-gradient(ellipse at 50% 30%,var(--wall2),var(--wall) 55%,var(--bg));}
/* piso a cuadros */
#app::after{content:"";position:fixed;left:0;right:0;bottom:0;height:22vh;pointer-events:none;
  background:conic-gradient(#0b0f18 25%,#3a2f33 0 50%,#0b0f18 0 75%,#3a2f33 0) 0 0/64px 64px;
  transform-origin:bottom;transform:perspective(300px) rotateX(55deg);opacity:.75;z-index:0}
#app::before{content:"";position:fixed;left:0;right:0;bottom:calc(22vh - 6px);height:34px;pointer-events:none;
  background:conic-gradient(#0e1522 25%,#2a3446 0 50%,#0e1522 0 75%,#2a3446 0) 0 0/34px 34px;opacity:.6;z-index:0}
.screen{display:none;flex:1;position:relative;z-index:1;padding:28px 18px 26vh;flex-direction:column;align-items:center;text-align:center;gap:18px}
.screen.on{display:flex;animation:in .35s ease-out}
@keyframes in{from{opacity:0}to{opacity:1}}
h1,h2{font-family:var(--pix);font-weight:700;color:var(--cream);margin:0;line-height:1.25;letter-spacing:.04em;text-shadow:3px 3px 0 #000}
h1{font-size:clamp(28px,8vw,54px)} h2{font-size:clamp(22px,6vw,40px)}
p.sub{font-family:var(--pix);font-size:clamp(13px,3.6vw,18px);margin:0;color:var(--cream)}
.btn{font-family:var(--pix);font-weight:700;font-size:16px;color:var(--cream);background:#10151f;border:3px solid var(--cream);
  padding:12px 30px;border-radius:12px;cursor:pointer;box-shadow:0 5px 0 #000;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
.btn:focus-visible,.plush:focus-visible,.pill:focus-visible,.slot:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.center{margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:22px}
#count{font-family:var(--pix);font-weight:700;font-size:clamp(90px,34vw,200px);color:var(--cream);text-shadow:4px 4px 0 #000,0 0 40px rgba(242,184,75,.35);margin:auto}
/* cumpleaños */
.marquee{position:relative;width:min(92vw,520px);padding:26px 18px 34px;background:var(--orange);border:8px solid var(--gold);
  border-radius:48px;box-shadow:0 0 0 6px #7a2e12,0 0 36px rgba(242,184,75,.45)}
.marquee h1{font-size:clamp(26px,8vw,48px);color:#ffe9b0}
.stars{font-size:46px;letter-spacing:10px;animation:bob 1.6s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
/* peluches */
.plushes{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;width:min(94vw,640px)}
@media(min-width:620px){.plushes{grid-template-columns:repeat(4,1fr)}}
.plush{background:rgba(8,12,20,.55);border:3px solid #3b4a63;border-radius:14px;padding:14px 8px 12px;cursor:pointer;color:var(--cream);
  font-family:var(--pix);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:10px;transition:transform .15s,border-color .15s}
.plush:hover{transform:translateY(-4px);border-color:var(--gold)}
.plush .face{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:54px;overflow:hidden;background:var(--c);box-shadow:inset 0 -8px 0 rgba(0,0,0,.25)}
.plush .face.has{background:none;box-shadow:none;border-radius:0;width:130px;height:130px}
.plush .face img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 0 rgba(0,0,0,.45))}
.plush small{font-family:var(--txt);font-size:20px;opacity:.85}
.plush.done{border-color:var(--gold)} .plush.done::after{content:"♥";color:#ff6b81;font-size:20px}
/* frases */
.pills{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(94vw,640px)}
.pill{font-family:var(--pix);font-size:clamp(10px,2.9vw,14px);line-height:1.4;color:var(--ink);background:var(--paper);border:0;border-radius:40px;padding:16px 12px;cursor:pointer;box-shadow:0 4px 0 #000;transition:transform .15s,background .15s}
.pill.on{background:#ffd3da;transform:scale(1.04)} .pill.on::before{content:"♥ ";color:#d6284b}
/* playlist */
.player{width:min(94vw,640px);display:grid;gap:16px;text-align:left}
.album{display:flex;gap:14px;align-items:center;background:#3a2417;border:3px solid #5a3a24;border-radius:10px;padding:12px}
.cover{width:84px;height:84px;border-radius:6px;background:#f5d9d0;display:grid;place-items:center;font-size:44px;flex:none}
.album b{font-family:var(--pix);font-size:22px;display:block} .album span{opacity:.7}
.tracks{list-style:none;margin:0;padding:0;background:#3a2417;border-radius:10px;border:3px solid #5a3a24}
.tracks li{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;border-bottom:2px solid #4a2f1d}
.tracks li:last-child{border:0} .tracks li.on{background:#5a3a24}
.tracks .n{width:22px;opacity:.6} .tracks .t{flex:1} .tracks .t b{display:block;font-family:var(--pix);font-size:13px} .tracks .t span{opacity:.65}
.note{background:var(--paper);color:var(--ink);border-radius:10px;padding:18px;font-size:22px;line-height:1.15;box-shadow:0 6px 0 #000}
.poema{font-size:21px;line-height:1.1}
.poema .pt{font-family:var(--pix);font-size:16px;margin-bottom:12px}
.poema .pv{white-space:pre-line}
.poema .art{display:table;margin:14px auto;text-align:left;font-family:var(--txt);font-size:26px;line-height:1.1}
#nota-fotos{white-space:pre-line}
.note.big{max-width:min(94vw,560px);text-align:center}
.embed{display:grid;gap:14px;justify-items:stretch}
.embed iframe{border:0;border-radius:12px;max-width:100%;background:#121212}
.embed .btn{text-decoration:none;justify-self:center}
.embed .card{display:flex;gap:14px;align-items:center;text-align:left;background:#3a2417;border:3px solid #5a3a24;border-radius:10px;padding:14px}
.embed .card b{font-family:var(--pix);font-size:15px;display:block;margin-bottom:4px}
.embed .card small{opacity:.7;font-size:20px}
.deck{background:#3a2417;border:3px solid #5a3a24;border-radius:10px;padding:14px;gap:10px;text-align:center}
.now b{font-family:var(--pix);font-size:15px;display:block;min-height:1.3em} .now small{opacity:.7;font-size:20px;display:block;min-height:1.2em}
.ctl{display:flex;justify-content:center;align-items:center;gap:14px}
.ic{font-size:22px;line-height:1;width:48px;height:48px;border-radius:50%;border:3px solid var(--cream);background:#10151f;color:var(--cream);cursor:pointer;box-shadow:0 4px 0 #000}
.ic.big{width:60px;height:60px;font-size:28px;background:var(--orange)} .ic:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.ic:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#seek{width:100%;accent-color:var(--gold)} .time{display:flex;justify-content:space-between;opacity:.75;font-size:20px}
.tracks{max-height:42vh;overflow-y:auto}
.tracks li:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.embed iframe{height:232px}
/* fotos */
.wall{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;padding:6px;width:min(96vw,720px)}
.slot{background:var(--orange);border:0;padding:8px 8px 26px;box-shadow:0 5px 0 #000;cursor:pointer;color:var(--cream);font-family:var(--pix);font-size:11px;transform:rotate(var(--r));cursor:default;width:min(44vw,230px)}
.slot .ph{aspect-ratio:1/1;background:#1a1410;display:grid;place-items:center;overflow:hidden;font-size:30px}
.slot .ph img{width:100%;height:100%;object-fit:cover}
.hint{font-size:20px;opacity:.7;margin:0}
.back{margin-top:auto}
.cartas{display:grid;gap:14px;justify-items:center}
/* celular en horizontal */
@media (orientation:landscape) and (max-height:520px){
  body{font-size:19px}
  #app::after{height:16vh} #app::before{bottom:calc(16vh - 5px);height:22px}
  .screen{padding:12px 16px 18vh;gap:10px}
  h1{font-size:clamp(22px,6vw,34px)} h2{font-size:clamp(16px,4vw,24px)}
  p.sub{font-size:13px}
  .btn{font-size:13px;padding:8px 22px}
  .center{gap:12px}
  #count{font-size:38vh}
  .stars{font-size:26px}
  .marquee{padding:14px 14px 20px;border-width:6px;border-radius:34px;width:min(70vw,460px)}
  .marquee h1{font-size:clamp(20px,5vw,32px)}
  .plushes{grid-template-columns:repeat(4,1fr);gap:10px;width:min(92vw,640px)}
  .plush{padding:8px 4px;gap:4px;font-size:11px}
  .plush .face{width:64px;height:64px;font-size:34px}
  .plush .face.has{width:84px;height:84px}
  .plush small{font-size:16px}
  .pills{grid-template-columns:repeat(5,1fr);gap:8px;width:min(96vw,760px)}
  .pill{padding:10px 6px;font-size:10px}
  .player{grid-template-columns:1fr 1fr;align-items:start;width:min(96vw,760px)}
  .player .embed{grid-column:1}
  .deck{padding:10px}
  .player .note{grid-column:2;grid-row:1;font-size:17px;padding:12px}
  .cover{width:56px;height:56px;font-size:30px}
  .note.big{font-size:18px;padding:14px;max-width:min(90vw,760px)}
  .wall{gap:14px}
  .slot{padding:5px 5px 14px;width:min(24vw,170px)}
  .hint{font-size:16px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">

  <section class="screen on" id="s-inicio">
    <div class="center">
      <h1>Hola mi amor</h1>
      <p class="sub">¿Quieres ver tu sorpresa?</p>
      <button class="btn" id="btn-si">Sí</button>
    </div>
  </section>

  <section class="screen" id="s-count"><div id="count">3</div></section>

  <section class="screen" id="s-cumple">
    <div class="center">
      <div class="stars" aria-hidden="true">★ ★ ★</div>
      <div class="marquee"><h1>Feliz cumpleaños</h1></div>
      <button class="btn" id="btn-cont">Continuar</button>
    </div>
  </section>

  <section class="screen" id="s-menu">
    <h2>Sorpresa mi amor!!</h2>
    <p class="sub">Elige cada uno</p>
    <div class="plushes" id="plushes"></div>
    <p class="hint" id="menu-hint"></p>
  </section>

  <section class="screen" id="s-frases">
    <h2>Todo esto es para ti amor</h2>
    <div class="pills" id="pills"></div>
    <button class="btn back" data-back>Volver</button>
  </section>

  <section class="screen" id="s-playlist">
    <h2>Nuestra playlist</h2>
    <div class="player">
      <div class="embed deck">
        <div class="now"><b id="np-t">&nbsp;</b><small id="np-a">&nbsp;</small></div>
        <div class="ctl">
          <button class="ic" id="prev" aria-label="Anterior">&#9198;&#xFE0E;</button>
          <button class="ic big" id="play" aria-label="Reproducir">&#9654;&#xFE0E;</button>
          <button class="ic" id="next" aria-label="Siguiente">&#9197;&#xFE0E;</button>
        </div>
        <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Progreso">
        <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
        <ul class="tracks" id="tracks"></ul>
        <audio id="aud" preload="metadata"></audio>
      </div>
      <div class="note" id="nota-playlist"></div>
    </div>
    <button class="btn back" data-back>Volver</button>
  </section>

  <section class="screen" id="s-fotos">
    <h2>Nuestras fotos</h2>
    <div class="wall" id="wall"></div>
    <div class="note big" id="nota-fotos"></div>
    <button class="btn back" data-back>Volver</button>
  </section>

  <section class="screen" id="s-carta">
    <h2>Te dedico esto mi amor</h2>
    <div class="cartas"><div class="note big" id="nota-carta"></div></div>
    <button class="btn back" data-back>Volver</button>
  </section>

</div>

<script>
/* ===== EDITA AQUÍ ===== */
const TEXTO_CARTA = "Te dedico esta playlist porque cada canción me hace pensar en ti y en todo lo que siento cuando estamos juntos. Hay canciones que me recuerdan momentos, otras que simplemente tienen esa sensación que me transmites y algunas que siento que dicen cosas que a veces no sé cómo expresar con palabras. Quise reunirlas todas aquí para que, cuando las escuches, puedas sentir, aunque sea un poquito, todo el cariño que tengo por ti. Espero que cada canción te recuerde lo especial que eres para mí y que, de alguna manera, esta playlist se convierta en un pequeño pedacito de nosotros.";
/* poema de la carta (Chica) */
const POEMA = "💗 PARA TI, MI AMOR 💗\n\nHoy quiero regalarte algo que nace de mi interior,\nno está envuelto en papel, ni adornado con una flor;\nno tiene oro, ni diamantes, ni riquezas que ofrecer,\npero lleva todo aquello que por ti puedo sentir y ofrecer.\n\nSon palabras que he guardado en lo profundo de mi pecho,\nsentimientos que por ti florecen y que jamás estarán deshechos;\ncada verso lleva un poco de mi alma y mi verdad,\npues escribirte lo que siento es mi forma de entregarte la eternidad.\n   ♡ \nQuisiera que al leerme pudieras comprender\nque no existe un solo día en que no te quiera querer;\nque cada letra lleva un beso que quisiera darte,\ny cada rima es un abrazo que quisiera regalarte.\n\nTe deseo con la fuerza de mil mares al chocar,\ncon la intensidad del fuego que no deja de quemar;\ndeseo tus labios, tus caricias y tu piel,\ny perderme entre tus brazos como un eterno amanecer.\n   ♡🌙 ♡\nQuisiera se la luna que te alumbre al descansar,\nla estrella que te cuide cuando salgas a soñar;\nser el refugio de tus penas, tu alegría y tu ilusión,\ny entregarte sin reservas lo más puro de mi corazón.\n\nNo existe tiempo suficiente para amarte como quiero,\nni distancia que consiga convertir mi amor en hielo;\nporque incluso si los siglos decidieran transcurrir,\nmi corazón seguiría encontrando mil razones para ti.\n  ♡ \nTe elegiría en mil vidas, en mil mundos por crear,\nen universos donde nadie nos pudiera separar;\ny aunque el destino me obligara mil caminos a recorrer,\nen cada uno de ellos volvería a escogerte como ayer.\n\nY si alguna vez dudas de lo mucho que te amo,\nrecuerda que entre estos versos mi corazón te estoy entregando;\nque no son simples palabras escritas por inspiración,\nson pedazos de mi alma convertidos en canción.\n   .・。.・゜✭・.・✫・゜・。.\nGuarda este pequeño regalo, aunque no sea material,\npues contiene un sentimiento que no conoce un final;\ncada línea fue escrita pensando solamente en ti,\ny cada palabra lleva algo de lo que provocas en mí.\n\nNo pretendo que estos versos puedan todo describir,\nni que alcancen la grandeza de lo que me haces sentir;\nsolamente quiero darte algo que jamás pueda comprarse,\nun pedacito de mi alma que siempre pueda acompañarte.\n   ♡ \nY cuando termines de leer, quisiera que pudieras notar\nque no hay regalo más sincero que un corazón dispuesto a amar;\nporque este poema es mío, pero su razón de existir eres tú,\ny si mi amor tuviera nombre, llevaría escrito el tuyo.\n\nTe entrego estos versos, mi cariño y mi verdad,\ncon la esperanza de que los guardes por toda la eternidad;\npues no hay mayor fortuna, ni tesoro más divino,\nque regalarte todo mi amor y compartir contigo mi camino.\n\n         ♡ ∩_∩\n         (｡•ᴗ•｡)♡\n         / >💗\n\nCon todo lo que soy, con todo lo que siento y con todo lo que aún me queda por amar: para ti, mi amor.\n\n         💗 TE AMO INFINITAMENTE💗\n             💗MI BIZCOCHITO DE NUEZ💗";

const $ = s => document.querySelector(s);
const show = id => { document.querySelectorAll('.screen').forEach(s => s.classList.remove('on')); $('#s-'+id).classList.add('on'); window.scrollTo(0,0); };
const visited = new Set();

let contando = false;
$('#btn-si').onclick = () => {
  if (contando) return; contando = true;
  show('count'); let n = 3; $('#count').textContent = n;
  const t = setInterval(() => { n--; if (n === 0) { clearInterval(t); show('cumple'); } else $('#count').textContent = n; }, 900);
};
$('#btn-cont').onclick = () => show('menu');

function renderMenu(){
  const box = $('#plushes'); box.innerHTML = '';
  PELUCHES.forEach(p => {
    const b = document.createElement('button');
    b.className = 'plush' + (visited.has(p.id) ? ' done' : '');
    b.style.setProperty('--c', p.color);
    b.innerHTML = '<span class="face'+(p.img?' has':'')+'">' + (p.img ? '<img alt="" src="'+p.img+'">' : p.emoji) + '</span>' + p.nombre + '<small>' + p.label + '</small>';
    b.onclick = () => { visited.add(p.id); show(p.id); };
    box.appendChild(b);
  });
  $('#menu-hint').textContent = visited.size === PELUCHES.length ? 'Los abriste todos ♥' : '';
}
document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => { renderMenu(); show('menu'); });
renderMenu();

/* frases */
FRASES.forEach(f => {
  const b = document.createElement('button'); b.className = 'pill'; b.textContent = f;
  b.onclick = () => b.classList.toggle('on'); $('#pills').appendChild(b);
});

/* playlist */
$('#nota-playlist').textContent = TEXTO_CARTA;
(function(){
  const box = $('#nota-carta'); box.classList.add('poema');
  const m = POEMA.match(/[ \t]*♡ ∩_∩\n[ \t]*\(｡•ᴗ•｡\)♡\n[ \t]*\/ >💗/);
  const mk = (cls, txt) => { const d = document.createElement('div'); d.className = cls; d.textContent = txt; box.appendChild(d); };
  const antes = (m ? POEMA.slice(0, m.index) : POEMA).trim();
  const lineas = antes.split('\n');
  mk('pt', lineas[0].trim()); mk('pv', lineas.slice(1).join('\n').trim());
  if (m) {
    const art = document.createElement('pre'); art.className = 'art';
    art.textContent = m[0].split('\n').map(l => l.trim()).join('\n'); box.appendChild(art);
    mk('pv', POEMA.slice(m.index + m[0].length).trim());
  }
})();

/* reproductor: [archivo, título, artista] — los mp3 van en la carpeta audio */
const CANCIONES = [
  ["audio/el-libro-de-la-vida.mp3","El libro de la vida (te amo y más)",""],
  ["audio/i-wanna-be-yours.mp3","I Wanna Be Yours",""],
  ["audio/enamorado-tuyo.mp3","Enamorado tuyo","El Cuarteto de Nos"],
  ["audio/sexto-sentido.mp3","Sexto sentido","008RACCA"],
  ["audio/somethin-stupid.mp3","Somethin’ Stupid",""],
  ["audio/cant-help-falling-in-love.mp3","Can’t Help Falling in Love","Elvis Presley"],
  ["audio/amor-de-siempre.mp3","Amor de Siempre","Cuco"],
  ["audio/locos.mp3","Locos","León Larregui"],
  ["audio/contigo.mp3","Contigo",""],
  ["audio/la-que-me-gusta.mp3","La que me gusta","Los Amigos Invisibles"],
  ["audio/gone-gone-gone.mp3","Gone, Gone, Gone (Español)","Phillip Phillips · Peter y Gwen"]
];
const aud = $('#aud'), seek = $('#seek'), playBtn = $('#play'); let cur = 0;
const mmss = s => isFinite(s) ? Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0') : '0:00';
CANCIONES.forEach((c,i) => {
  const li = document.createElement('li'); li.tabIndex = 0;
  li.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') li.click(); };
  li.innerHTML = '<span class="n">'+(i+1)+'</span><span class="t"><b></b><span></span></span>';
  li.querySelector('b').textContent = c[1]; li.querySelector('.t span').textContent = c[2];
  li.onclick = () => cargar(i, true);
  $('#tracks').appendChild(li);
});
function cargar(i, reproducir){
  cur = (i + CANCIONES.length) % CANCIONES.length;
  aud.src = CANCIONES[cur][0];
  $('#np-t').textContent = CANCIONES[cur][1]; $('#np-a').textContent = CANCIONES[cur][2] || '\u00a0';
  document.querySelectorAll('.tracks li').forEach((x,k) => x.classList.toggle('on', k === cur));
  seek.value = 0; $('#cur').textContent = '0:00';
  if (reproducir) aud.play().catch(() => {});
}
playBtn.onclick = () => { if (!aud.src) cargar(0, true); else if (aud.paused) aud.play().catch(() => {}); else aud.pause(); };
$('#next').onclick = () => cargar(cur + 1, !aud.paused || !aud.src);
$('#prev').onclick = () => { if (aud.currentTime > 3) aud.currentTime = 0; else cargar(cur - 1, !aud.paused); };
aud.onplay = () => playBtn.innerHTML = '&#10074;&#10074;'; aud.onpause = () => playBtn.innerHTML = '&#9654;&#xFE0E;';
aud.onloadedmetadata = () => $('#dur').textContent = mmss(aud.duration);
aud.ontimeupdate = () => { if (aud.duration) seek.value = aud.currentTime / aud.duration * 100; $('#cur').textContent = mmss(aud.currentTime); };
aud.onended = () => cargar(cur + 1, true);
aud.onerror = () => { $('#np-a').textContent = 'No se encontró el archivo de audio'; };
seek.oninput = () => { if (aud.duration) aud.currentTime = seek.value / 100 * aud.duration; };
cargar(0, false);
